services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alumni
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  minio:
    # ponytail: minio/minio was pulled from Docker Hub (Sep 2026) and quay.io/minio/minio
    # now requires auth; pgsty/silo is a maintained drop-in fork (same binary, same env vars,
    # same argv translation for `server ...`). Swap back to minio/minio if it ever returns.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    # ponytail: minio/mc was pulled alongside minio/minio; pgsty/silo also bundles `mc`.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on: [minio]
    restart: "no"
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/alumni; exit 0"
volumes:
  pgdata:
  miniodata:
